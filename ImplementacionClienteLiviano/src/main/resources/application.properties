spring.application.name=cliente-liviano
server.port=${PORT:8085}
server.address=0.0.0.0

# Actuator endpoints para health checks de Railway
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Encoding
spring.mandatory-file-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

server.forward-headers-strategy=FRAMEWORK
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.protocol-header-https-value=https

# Logging - Niveles para produccion (cambiar a DEBUG solo para debug)
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

agregador.url=${AGREGADOR_URL:http://localhost:8080}
fuenteestatica.url=${FUENTE_ESTATICA_URL:http://localhost:8081}
fuentedinamica.url=${FUENTE_DINAMICA_URL:http://localhost:8082}
fuenteproxy.url=${FUENTE_PROXY_URL:http://localhost:8083}
estadisticas.url=${ESTADISTICAS_URL:http://localhost:8084}
auth.service.url=${AGREGADOR_URL:http://localhost:8080}/usuarios/auth
usuarios.service.url=${AGREGADOR_URL:http://localhost:8080}/usuarios
agregador.graphql.url=${AGREGADOR_URL:http://localhost:8080}/graphql

# Configuracion para gestion de procesos
app.microservices.fuenteestatica.jar-path=../fuenteEstatica/target/fuenteEstatica-0.0.1-SNAPSHOT.jar
app.microservices.fuenteestatica.working-dir=../fuenteEstatica
app.microservices.fuentedinamica.jar-path=../fuenteDinamica/target/fuenteDinamica-0.0.1-SNAPSHOT.jar
app.microservices.fuentedinamica.working-dir=../fuenteDinamica
app.microservices.fuenteproxy.jar-path=../fuenteProxy/target/fuenteProxy-0.0.1-SNAPSHOT.jar
app.microservices.fuenteproxy.working-dir=../fuenteProxy
app.microservices.agregador.jar-path=../agregador/target/agregador-0.0.1-SNAPSHOT.jar
app.microservices.agregador.working-dir=../agregador
app.microservices.health-check.timeout=30000
app.microservices.health-check.interval=5000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Config para archivos grandes
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-swallow-size=-1

# Tiempo maximo de inactividad antes de que expire la sesion
server.servlet.session.timeout=30m

# Timeout para importaciones largas (5 minutos)
spring.mvc.async.request-timeout=300000
feign.client.config.default.connectTimeout=300000
feign.client.config.default.readTimeout=300000

multimedia.base-url=${FUENTE_DINAMICA_URL:http://localhost:8082}
