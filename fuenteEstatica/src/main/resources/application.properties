spring.application.name=fuenteEstatica
server.port=${PORT:8081}
server.address=0.0.0.0

# Normalizador de categorias
normalizador.categoria.umbral-similitud=${UMBRAL_SIMILITUD_CATEGORIA:0.92}

server.forward-headers-strategy=FRAMEWORK
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.protocol-header-https-value=https

# Logging - Niveles para produccion (cambiar a DEBUG solo para debug)
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

#Rutas que acceden al servicio, sirve para securizar
agregador.url=${AGREGADOR_URL:http://localhost:8080}
clienteLiviano.url=${CLIENTE_LIVIANO_URL:http://localhost:8085}
# Configuracion de la base de datos - Local MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/ddsi_2025_mm_estatica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=2&useUnicode=true&characterEncoding=UTF-8&maxAllowedPacket=67108864&connectTimeout=60000&socketTimeout=600000
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configuracion de HikariCP (Connection Pool) - OPTIMIZADO PARA RESILIENCIA
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
# idle-timeout: Cierra conexiones inactivas despues de 10 minutos
spring.datasource.hikari.idle-timeout=600000
# max-lifetime: Renovar conexiones cada 30 minutos (antes de que MySQL las cierre)
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=120000
# VALIDACION AUTOMATICA DE CONEXIONES - Previene "Connection is closed"
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Keepalive cada 2 minutos para mantener conexiones vivas durante importaciones largas
spring.datasource.hikari.keepalive-time=120000
# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Optimizaciones para batch processing con FLUSH/CLEAR manual
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
# Deshabilitar Open Session In View (anti-pattern que causa lazy loading fuera de transacciones)
spring.jpa.open-in-view=false
# Timeouts para transacciones largas (importacion CSV) - 30 minutos
spring.transaction.default-timeout=1800
# Configuracion de archivos multipart (sin limite)
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-swallow-size=-1

# Timeout para peticiones HTTP largas (5 minutos)
server.tomcat.connection-timeout=300000
spring.mvc.async.request-timeout=300000

# Configuracion de directorio de uploads
app.upload.dir=uploads/csv
# Habilitar endpoints de actuator - Observabilidad completa
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.enable.all=true
management.prometheus.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=development
info.app.name=${spring.application.name}
info.app.description=Fuente Estatica - Importacion de CSV
info.app.version=1.0.0

# Resilience4j - Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j - Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
