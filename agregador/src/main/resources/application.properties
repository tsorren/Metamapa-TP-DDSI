spring.application.name=agregador
server.port=${PORT:8080}
server.address=0.0.0.0

# Normalizador de categorias
normalizador.categoria.umbral-similitud=${UMBRAL_SIMILITUD_CATEGORIA:0.92}

server.forward-headers-strategy=FRAMEWORK
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.protocol-header-https-value=https

# Logging - Niveles para produccion (cambiar a DEBUG solo para debug)
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Configuracion de URLs de Fuentes - Railway HTTP interno
fuente.dinamica.url=${FUENTE_DINAMICA_URL:http://localhost:8082}
fuente.estatica.url=${FUENTE_ESTATICA_URL:http://localhost:8081}
fuente.proxy.url=${FUENTE_PROXY_URL:http://localhost:8083}

#Rutas que acceden o responden al servicio, sirve para securizar
clienteLiviano.url=${CLIENTE_LIVIANO_URL:http://localhost:8085}
fuenteproxy.url=${FUENTE_PROXY_URL:http://localhost:8083}
estadisticas.url=${ESTADISTICAS_URL:http://localhost:8084}
filtro.spam.palabras=gratis,dinero facil,hazte rico,trabaja desde casa,oferta exclusiva,urgente,gana dinero,promocion,click aqui
filtro.spam.umbral=4
cron.intervaloProcesamientoSolicitudes=${INTERVALO_PROCESAMIENTO_SOLICITUDES:0 0 * * * *}
cron.intervaloCuracionHechos=${INTERVALO_CURACION_HECHOS:0 0 3 * * *}
cron.intervaloRefresco=${INTERVALO_REFRESCO:0 0 * * * *}
# Configuracion de administrador por defecto
default.admin.name=admin
default.admin.password=admin123
# Actuator endpoints - Observabilidad completa
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,httptrace,env,beans,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.enable.all=true
management.prometheus.metrics.export.enabled=true

# Resilience4j - Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Circuit Breaker para Fuente Dinamica
resilience4j.circuitbreaker.instances.fuenteDinamica.base-config=default
resilience4j.circuitbreaker.instances.fuenteDinamica.failure-rate-threshold=60

# Circuit Breaker para Fuente Estatica
resilience4j.circuitbreaker.instances.fuenteEstatica.base-config=default
resilience4j.circuitbreaker.instances.fuenteEstatica.failure-rate-threshold=60

# Resilience4j - Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2

# Retry para Fuente Dinamica
resilience4j.retry.instances.fuenteDinamica.base-config=default
resilience4j.retry.instances.fuenteDinamica.max-attempts=3

# Rate Limiting Configuration
ratelimit.enabled=true
ratelimit.capacity=500
ratelimit.refill-tokens=500
ratelimit.refill-duration-minutes=1
ratelimit.cache-size=100000
ratelimit.cache-expire-minutes=10

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.schema.printer.enabled=true
spring.graphql.schema.locations=classpath:graphql/**/*.graphqls
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
# Retry para Fuente Estatica
resilience4j.retry.instances.fuenteEstatica.base-config=default
resilience4j.retry.instances.fuenteEstatica.max-attempts=3
# Tags personalizados para metricas
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=development
# Configuracion de info endpoint
info.app.name=${spring.application.name}
info.app.java.version=@java.version@
info.app.encoding=@project.build.sourceEncoding@
info.app.version=1.0.0
info.app.description=Servicio Agregador - Sistema de Gestion de Hechos
# Configuracion de la base de datos - Local MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/ddsi_2025_mm_agregador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&maxAllowedPacket=67108864&connectTimeout=60000&socketTimeout=600000
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configuracion de HikariCP (Connection Pool)
# Configurado para evitar Communications link failure y Connection is closed
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# idle-timeout: Cierra conexiones inactivas despues de 10 minutos
spring.datasource.hikari.idle-timeout=600000
# max-lifetime: Renovar conexiones cada 30 minutos (antes de que MySQL las cierre)
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# VALIDACION AUTOMATICA DE CONEXIONES - Previene Connection is closed
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
# Keepalive cada 5 minutos para mantener conexiones vivas
spring.datasource.hikari.keepalive-time=300000
# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Deshabilitar Open Session In View (anti-pattern que causa lazy loading fuera de transacciones)
spring.jpa.open-in-view=false
# Timeouts para transacciones largas (procesamiento masivo)
spring.transaction.default-timeout=600
spring.jpa.properties.jakarta.persistence.query.timeout=600000
